name: Submit Gradle Dependency Graph

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Dynamically inject the missing :sdk module in memory
      - name: Create Temporary Gradle Init Script
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          gradle.settingsEvaluated { settings ->
              if (!settings.findProject(':sdk')) {
                  settings.include(':sdk')
                  settings.project(':sdk').projectDir = settings.rootDir
              }
          }
          EOF

      - name: Submit Dependency Graphs
        uses: gradle/actions/dependency-submission@v3
        with:
          gradle-version: '7.6.6'
          dependency-graph-continue-on-failure: 'true'
          build-root-directory: |
            output-management/web-viewer/favorites
            output-management/web-viewer/favorites/favorites
            output-management/web-viewer/downloader
            output-management/web-viewer/downloader/application
            output-management/web-viewer/api-basics/java
            share/2022_columbus/AtoZ/email-spring-boot
