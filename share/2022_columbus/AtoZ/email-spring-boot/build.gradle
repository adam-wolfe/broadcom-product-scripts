plugins {
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
	id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '1.8'

// Overrides the vulnerable SnakeYAML version inherited by Spring Boot 2.7
ext['snakeyaml.version'] = '2.0'
ext['org.apache.tomcat.embed:tomcat-embed-core'] = '9.0.123'
ext['commons-lang:commons-lang'] = '3.18.0'
ext['com.google.guava:guava'] = '33.7.2-jre'

repositories {
	mavenCentral()
	maven { setUrl('https://zowe.jfrog.io/zowe/libs-release/') }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	
	implementation "org.zowe.apiml.sdk:onboarding-enabler-spring:2.19.3"
	
	// Upgraded to patch Guava and Jackson vulnerabilities
	implementation "io.springfox:springfox-swagger2:2.9.2"
	implementation "io.springfox:springfox-spring-web:2.9.2"
	implementation 'io.swagger.core.v3:swagger-jaxrs2:2.2.15'
	
	// Minor bump to prevent older Lombok execution issues on newer build servers
	implementation "org.projectlombok:lombok:1.18.30"
	annotationProcessor "org.projectlombok:lombok:1.18.30"
}

tasks.named('test') {
	useJUnitPlatform()
}
