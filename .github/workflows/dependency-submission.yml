name: Gradle Dependency Submission

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  submit-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Executes Gradle natively to extract EVERY dependency (direct, dynamic, and transitive)
      - name: Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v3
